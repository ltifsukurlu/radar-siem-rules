name: Deploy Rules to QRadar SIEM

on:
  push:
    branches:
      - main
    paths:
      - 'rules/**'
      - 'deploy_qradar_rules.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"   # <-- Bunu bura əlavə et ki, xətalar dərhal loqda görünsün

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Deploy Rules via QRadar API
        env:
          QRADAR_HOST: ${{ secrets.QRADAR_HOST }}
          QRADAR_SEC_TOKEN: ${{ secrets.QRADAR_SEC_TOKEN }}
        run: |
          python deploy_qradar_rules.py
